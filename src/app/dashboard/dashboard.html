<div class="dashboard">
  <header class="dashboard-header">
    <h1>Tasks</h1>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Add Task
    </button>
  </header>

  <table mat-table [dataSource]="tasks()" class="task-table">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let task">{{ task.title }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let task">{{ task.status }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let task">{{ task.createdAt | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let task">
        <button mat-icon-button aria-label="Edit task" (click)="openEditDialog(task)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button aria-label="Delete task" (click)="confirmDelete(task)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  @if (tasks().length === 0) {
    <p class="empty-state">No tasks yet. Add one to get started.</p>
  }
</div>
